  // Une seule lecture de la position, sous forme de promesse
  function positionActuelle() {
    return new Promise((resoudre, rejeter) => {
      if (!navigator.geolocation) { rejeter(new Error('indisponible')); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resoudre([pos.coords.longitude, pos.coords.latitude]),
        rejeter,
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 }
      );
    });
  }

  // Après une annulation ou la fin du trajet : la carte revient sur ta position
  async function revenirSurPosition() {
    let cible = marqueurPosition ? marqueurPosition.getLngLat().toArray() : CENTRE_CALAIS;
    try {
      cible = await positionActuelle();
      placerMarqueurPosition(cible);
    } catch (erreur) { /* on garde la dernière position connue */ }
    carte.flyTo({ center: cible, zoom: 16, pitch: 60, bearing: -20, offset: [0, 0] });
    verifierLieu(cible);
  }

  // Distance en mètres d'un point à un segment [a, b]
  function distanceSegment(p, a, b) {
    const k = Math.cos(p[1] * Math.PI / 180);
    const ax = (a[0] - p[0]) * k, ay = a[1] - p[1];
    const bx = (b[0] - p[0]) * k, by = b[1] - p[1];
    const dx = bx - ax, dy = by - ay;
    const longueur2 = dx * dx + dy * dy;
    let t = longueur2 === 0 ? 0 : -(ax * dx + ay * dy) / longueur2;
    t = Math.max(0, Math.min(1, t));
    const x = ax + t * dx, y = ay + t * dy;
    return Math.sqrt(x * x + y * y) * 111320;
  }

  // Distance d'un point au trajet (le plus proche de tous les segments)
  function distanceAuTrace(lonLat, coordonnees) {
    let minimum = Infinity;
    for (let i = 0; i < coordonnees.length - 1; i++) {
      const d = distanceSegment(lonLat, coordonnees[i], coordonnees[i + 1]);
      if (d < minimum) minimum = d;
    }
    return minimum;
  }

  // Transforme une étape en phrase française
  function texteInstruction(etape) {
    if (etape.texte) return etape.texte; // étapes de transport
    const m = etape.maneuver;
    const rue = etape.name ? ' sur ' + etape.name : '';
    const directions = {
      'left': 'à gauche', 'right': 'à droite',
      'slight left': 'légèrement à gauche', 'slight right': 'légèrement à droite',
      'sharp left': 'franchement à gauche', 'sharp right': 'franchement à droite',
      'straight': 'tout droit'
    };
    const direction = directions[m.modifier] || '';

    switch (m.type) {
      case 'arrive': return 'Vous êtes arrivé';
      case 'roundabout':
      case 'rotary': return 'Au rond-point, prenez la sortie ' + (m.exit || '') + rue;
      case 'turn': return m.modifier === 'uturn' ? 'Faites demi-tour' : 'Tournez ' + direction + rue;
      case 'fork': return 'Serrez ' + direction + rue;
      case 'end of road': return 'Au bout de la route, tournez ' + direction + rue;
      default: return 'Continuez ' + direction + rue;
    }
  }

  // Voix de synthèse (Web Speech API)
  function annoncer(phrase) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const voix = new SpeechSynthesisUtterance(phrase);
    voix.lang = 'fr-FR';
    window.speechSynthesis.speak(voix);
  }

  function afficherGuidage(texte, distance) {
    document.getElementById('guidage-texte').textContent = texte;
    document.getElementById('guidage-distance').textContent = distance === null ? '' : 'dans ' + formaterDistance(distance);
    bandeau.style.display = 'block';
  }

  // ----- Bouchons et perturbations (TomTom, avec ta clé) -----
  const TYPES_PERTURBATION = {
    1: 'Accident', 2: 'Brouillard', 3: 'Conditions dangereuses', 4: 'Pluie', 5: 'Verglas', 6: 'Bouchon',
    7: 'Voie fermée', 8: 'Route fermée', 9: 'Travaux', 10: 'Vent fort', 11: 'Inondation', 14: 'Véhicule en panne'
  };
  // Couleur selon la gravité du retard : jaune (léger), orange, rouge (important ou route fermée)
  const COULEURS_NIVEAU = { 1: '#ffd600', 2: '#ff9100', 3: '#ff1744', 4: '#ff1744' };
  let avertiCleTomtom = false;

  // Zone qui contient tous les trajets proposés
  function bornesDesTrajets(liste) {
    const premier = liste[0].coordonnees[0];
    const bornes = new maplibregl.LngLatBounds(premier, premier);
    liste.forEach((p) => p.coordonnees.forEach((point) => bornes.extend(point)));
    return bornes;
  }

  // Toutes les perturbations de la zone, sous une forme simple
  async function chargerIncidents(bornes) {
    // TomTom refuse les zones trop grandes
    if ((bornes.getEast() - bornes.getWest()) * (bornes.getNorth() - bornes.getSouth()) > 1) return [];
    const champs = '{incidents{type,geometry{type,coordinates},properties{iconCategory,magnitudeOfDelay,events{description},from,to,delay,roadNumbers}}}';
    const url = 'https://api.tomtom.com/traffic/services/5/incidentDetails?key=' + encodeURIComponent(reglages.cleTomtom) +
      '&bbox=' + [bornes.getWest(), bornes.getSouth(), bornes.getEast(), bornes.getNorth()].join(',') +
      '&fields=' + encodeURIComponent(champs) + '&language=fr-FR&timeValidityFilter=present';
    const donnees = await (await fetch(url)).json();

    const resultat = [];
    (donnees.incidents || []).forEach((incident) => {
      const geometrie = incident.geometry;
      const propriete = incident.properties || {};
      if (!geometrie || !geometrie.coordinates) return;
      const estLigne = geometrie.type !== 'Point';
      const points = estLigne ? geometrie.coordinates : [geometrie.coordinates];
      const niveau = propriete.iconCategory === 8 ? 4 : (propriete.magnitudeOfDelay || 2);
      const evenement = propriete.events && propriete.events[0] ? propriete.events[0].description : '';
      const lieu = (propriete.from || '') + (propriete.to ? ' → ' + propriete.to : '');
      resultat.push({
        cle: JSON.stringify(points[0]) + (propriete.iconCategory || ''),
        titre: TYPES_PERTURBATION[propriete.iconCategory] || 'Perturbation',
        texte: [evenement, lieu, (propriete.roadNumbers || []).join(', ')].filter(Boolean).join(' · '),
        retardMin: propriete.delay ? Math.round(propriete.delay / 60) : 0,
        couleur: COULEURS_NIVEAU[niveau] || '#ff9100',
        ligne: estLigne,
        points: points
      });
    });
    return resultat;
  }

  // Dessine sur la carte les perturbations du trajet choisi
  function dessinerIncidents() {
    const source = carte.getSource('incidents');
    if (!source) return;
    const morceaux = [];
    (itineraire && itineraire.incidents ? itineraire.incidents : []).forEach((i) => {
      if (i.ligne) morceaux.push({ type: 'Feature', properties: { couleur: i.couleur },
        geometry: { type: 'LineString', coordinates: i.points } });
      morceaux.push({ type: 'Feature', properties: { couleur: i.couleur },
        geometry: { type: 'Point', coordinates: i.points[0] } });
    });
    source.setData({ type: 'FeatureCollection', features: morceaux });
  }

  // Résumé du trafic sous les fiches (voiture seulement)
  function afficherTrafic() {
    const zone = document.getElementById('trafic-info');
    zone.innerHTML = '';
    if (mode !== 'voiture' || !itineraire) return;
    if (!reglages.cleTomtom) {
      zone.textContent = 'Bouchons : ajoute une clé TomTom dans Réglages pour les voir.';
      return;
    }
    if (!itineraire.traficCharge) {
      zone.textContent = 'Analyse du trafic…';
      return;
    }
    if (!itineraire.incidents.length) {
      const ok = document.createElement('span');
      ok.className = 'fluide';
      ok.textContent = '🟢 Trafic fluide sur ce trajet';
      zone.appendChild(ok);
      return;
    }
    itineraire.incidents.slice(0, 4).forEach((i) => {
      const ligne = document.createElement('div');
      ligne.className = 'ligne-trafic';
      const point = document.createElement('span');
      point.className = 'point';
      point.style.background = i.couleur;
      point.style.color = i.couleur;
      const texte = document.createElement('div');
      texte.textContent = i.titre + (i.retardMin ? ' · +' + i.retardMin + ' min' : '');
      const detail = document.createElement('small');
      detail.textContent = i.texte;
      texte.appendChild(detail);
      ligne.append(point, texte);
      zone.appendChild(ligne);
    });
  }

  function montrerAlerte(incident, nombre) {
    document.getElementById('alerte-titre').textContent =
      'Perturbation : ' + incident.titre + (nombre > 1 ? ' (+' + (nombre - 1) + ' autre(s))' : '');
    document.getElementById('alerte-texte').textContent = incident.texte;
    document.getElementById('alerte').style.display = 'block';
    if (navigationActive) annoncer('Attention, ' + incident.titre + ' sur votre trajet.');
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('Perturbation sur ton trajet', { body: incident.titre + ' : ' + incident.texte });
    }
  }

  // Cherche les perturbations sur tous les trajets proposés, puis prévient pendant la navigation
  async function verifierPerturbations() {
    afficherTrafic();
    if (!reglages.cleTomtom || mode !== 'voiture' || !propositions.length) return;
    const liste = propositions;
    try {
      const tous = await chargerIncidents(bornesDesTrajets(liste));
      if (liste !== propositions) return; // les trajets ont changé entre-temps
      liste.forEach((p) => {
        p.incidents = tous.filter((i) => i.points.some((point) => distanceAuTrace(point, p.coordonnees) < 120));
        p.retardTrafic = p.incidents.reduce((somme, i) => somme + i.retardMin, 0);
        p.traficCharge = true;
      });
      afficherCartes();
      dessinerIncidents();
      afficherTrafic();

      if (navigationActive && itineraire) {
        const nouvelles = itineraire.incidents.filter((i) => !perturbationsVues[i.cle]);
        if (nouvelles.length) {
          nouvelles.forEach((i) => { perturbationsVues[i.cle] = true; });
          montrerAlerte(nouvelles[0], nouvelles.length);
        }
      }
    } catch (erreur) {
      console.warn('Trafic indisponible', erreur);
      if (!avertiCleTomtom) {
        avertiCleTomtom = true;
        afficherMessage('Trafic indisponible : vérifie ta clé TomTom.', 5000);
      }
    }
  }

  // ----- Autres itinéraires et recalcul -----
  // Recalcule depuis la position actuelle (sortie de route, par exemple)
  async function recalculerDepuisPosition(lonLat, raison) {
    dernierRecalcul = Date.now();
    ecartsConsecutifs = 0;
    afficherMessage(raison + ' : recalcul…', 5000);
    try {
      const nouvelles = await chargerPropositions(lonLat, lieuArrivee.coord);
      if (!nouvelles.length || !navigationActive) return;
      propositions = nouvelles;
      choisie = 0;
      appliquerProposition(false);
      verifierPerturbations();
      annoncer('Itinéraire recalculé');
    } catch (erreur) {
      afficherMessage('Recalcul impossible pour le moment.');
    }
  }

  // Bouton "Autres itinéraires" pendant la navigation : on propose d'autres trajets depuis ici
  async function ouvrirAutresItineraires() {
    if (!navigationActive || !dernierePosition || !lieuArrivee) {
      afficherMessage('Position inconnue pour le moment.');
      return;
    }
    afficherMessage('Recherche d\u2019autres itinéraires…');
    try {
      const nouvelles = await chargerPropositions(dernierePosition, lieuArrivee.coord);
      if (!nouvelles.length) { afficherMessage('Pas d\u2019autre itinéraire trouvé.'); return; }
      propositions = nouvelles;
      choisie = 0;
      appliquerProposition(false);
      verifierPerturbations();
      zoneInfos.classList.add('choix-ouvert');
    } catch (erreur) {
      afficherMessage('Recherche impossible : vérifie ta connexion.');
    }
  }

  // Appelée à chaque nouvelle position (réelle ou simulée)
  function nouvellePosition(lonLat, capGps) {
    placerMarqueurPosition(lonLat);

    // Cap : celui du GPS s'il existe, sinon la direction du dernier déplacement
    let cap = capGps;
    if (!Number.isFinite(cap) && dernierePosition && distanceMetres(dernierePosition, lonLat) > 5) {
      cap = calculerCap(dernierePosition, lonLat);
    }
    if (!Number.isFinite(cap)) cap = carte.getBearing();
    dernierePosition = lonLat;

    // La caméra suit la position, vue de derrière
    carte.easeTo({ center: lonLat, bearing: cap, zoom: 18, pitch: 65,
      offset: [0, 150], duration: 400, easing: (t) => t });

    verifierLieu(lonLat);

    // Si on s'écarte du trajet (3 mesures de suite), on recalcule tout seul
    if (mode !== 'transport' && itineraire && lieuArrivee) {
      if (distanceAuTrace(lonLat, itineraire.coordonnees) > 60) ecartsConsecutifs++;
      else ecartsConsecutifs = 0;
      if (ecartsConsecutifs >= 3 && Date.now() - dernierRecalcul > 15000) {
        recalculerDepuisPosition(lonLat, 'Tu t\u2019es écarté de l\u2019itinéraire');
        return;
      }
    }

    // Une fois par minute, on regarde s'il y a une perturbation sur le trajet
    if (reglages.cleTomtom && mode === 'voiture' && Date.now() - derniereVerifTrafic > 60000) {
      derniereVerifTrafic = Date.now();
      verifierPerturbations();
    }

    mettreAJourGuidage(lonLat);
  }

  function mettreAJourGuidage(lonLat) {
    const etapes = itineraire.etapes;
    let prochaine = etapes[indexEtape + 1];
    let distance = distanceMetres(lonLat, prochaine.maneuver.location);
    const rayon = prochaine.rayon || 30;

    if (distance < rayon) {
      if (prochaine.maneuver.type === 'arrive') {
        afficherGuidage('Vous êtes arrivé', null);
        annoncer('Vous êtes arrivé');
        arreterNavigation(true);
        return;
      }
      // On a passé ce virage : on passe au suivant
      indexEtape++;
      prochaine = etapes[indexEtape + 1];
      distance = distanceMetres(lonLat, prochaine.maneuver.location);
      annoncer('Dans ' + formaterDistance(distance) + ', ' + texteInstruction(prochaine).toLowerCase());
    }
    afficherGuidage(texteInstruction(prochaine), distance);
  }

  function demarrerNavigation() {
    if (!itineraire) return;
    navigationActive = true;
    indexEtape = 0;
    dernierePosition = null;
    ecartsConsecutifs = 0;
    dernierRecalcul = Date.now();
    derniereVerifTrafic = 0;

    document.getElementById('modes').style.display = 'none';
    zoneInfos.classList.add('navigation');
    zoneInfos.classList.remove('choix-ouvert');
    majBoutons();

    // Pour être prévenu d'une perturbation même si l'onglet est en arrière-plan
    if (reglages.cleTomtom && 'Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    const premiere = itineraire.etapes[1];
    annoncer('Dans ' + formaterDistance(itineraire.etapes[0].distance) + ', ' + texteInstruction(premiere).toLowerCase());

    if (!navigator.geolocation) {
      afficherMessage('Géolocalisation non disponible sur ce navigateur.');
      arreterNavigation(false);
      return;
    }
    idSuivi = navigator.geolocation.watchPosition(
      (pos) => nouvellePosition([pos.coords.longitude, pos.coords.latitude], pos.coords.heading),
      () => afficherMessage('Position indisponible. Utilise localhost ou https.'),
      { enableHighAccuracy: true }
    );
  }

  // Bouton "Aller" : on part toujours de la position réelle, même si le départ choisi était ailleurs
  async function aller() {
    if (!itineraire) return;
    try {
      afficherMessage('Recherche de ta position…', 3000);
      const lonLat = await positionActuelle();
      placerMarqueurPosition(lonLat);
      definirDepart(null);
      await calculerItineraire(); // trajet recalculé depuis ici
    } catch (erreur) {
      afficherMessage('Position indisponible : impossible de te guider (localhost ou https requis).');
      return;
    }
    demarrerNavigation();
  }

  // Arrête le suivi (et la position n'est plus lue du tout)
  function arreterNavigation(arrivee) {
    navigationActive = false;
    if (idSuivi !== null) { navigator.geolocation.clearWatch(idSuivi); idSuivi = null; }
    if (!arrivee && window.speechSynthesis) { window.speechSynthesis.cancel(); }

    document.getElementById('modes').style.display = 'flex';
    zoneInfos.classList.remove('navigation', 'choix-ouvert');
    bandeau.style.display = arrivee ? 'block' : 'none';
    if (arrivee) setTimeout(() => { if (!navigationActive) bandeau.style.display = 'none'; }, 6000);
    effacerItineraire();
    majBoutons();
  }

  boutonAller.addEventListener('click', aller);
  boutonArreter.addEventListener('click', () => arreterNavigation(false));
  boutonAutres.addEventListener('click', ouvrirAutresItineraires);
  document.getElementById('btn-alerte-ok').addEventListener('click', () => {
    document.getElementById('alerte').style.display = 'none';
  });
  document.getElementById('btn-alerte-autres').addEventListener('click', () => {
    document.getElementById('alerte').style.display = 'none';
    if (navigationActive) ouvrirAutresItineraires();
  });

  // Clé TomTom (réglages)
  const saisieCle = document.getElementById('saisie-cle-tomtom');
  saisieCle.value = reglages.cleTomtom;
  saisieCle.addEventListener('change', () => {
    reglages.cleTomtom = saisieCle.value.trim();
    sauverReglages();
    avertiCleTomtom = false;
    if (propositions.length) verifierPerturbations();
  });
</script>
</body>
</html>
